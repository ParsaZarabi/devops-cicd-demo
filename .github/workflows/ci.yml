name: Python Application CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with Pytest
      run: pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:${{ github.sha }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted  # <--- اینجا دستور می‌دهیم روی سرور master شما اجرا شود

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Deploy to Kubernetes Cluster
      run: |
        # جایگزینی تگ ایمیج با شناسه کامیت جدید
        sed -i "s/IMAGE_VERSION/${{ github.sha }}/g" k8s/deployment.yaml
        
        # اعمال تنظیمات روی کلاستر
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
